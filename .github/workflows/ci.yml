name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Subnet calculator tests
        run: python -m unittest discover -s tests -v
      - name: Command line smoke test
        run: python tools/subnet.py 192.168.1.130/26 | grep -q "network    192.168.1.128"
